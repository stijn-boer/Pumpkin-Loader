[package]
name = "pumpkin-loader"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "2"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "1.1"
toml_edit = "0.25"
log = "0.4"
env_logger = "0.11"
indicatif = "0.18"
semver = { version = "1", features = ["serde"] }
walkdir = "2"
